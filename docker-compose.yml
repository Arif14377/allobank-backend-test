services:
  postgres:
    image: postgres:18-alpine
    container_name: split-bill-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-split_bill}
      POSTGRES_USER: ${DB_USERNAME:-split_bill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-split_bill}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
