spring:
  application:
    name: backend-test-allobank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/split_bill}
    username: ${DB_USERNAME:split_bill}
    password: ${DB_PASSWORD:split_bill}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
