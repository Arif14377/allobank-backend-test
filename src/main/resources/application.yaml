spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend-test-allobank
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
